<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="t d"><title id="t">One idea, four proofs</title><desc id="d">For a person: only you can send it. For a company: no one person can empty the account. For an agent: only within the limits you set. For everyone: no rate, no asterisk.</desc><style>@font-face{font-family:ZMono5;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:ZSans5;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:ZSans;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:ZMono;src:url(data:font/woff2;base64,) format('woff2')}
</style><defs><clipPath id="frame"><rect width="1280" height="330" rx="20"/></clipPath><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs><g clip-path="url(#frame)"><rect width="1280" height="330" fill="#000"/><rect x="48" y="56" width="276" height="3" fill="#ec9117"/><text x="48.0" y="96.0" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="11.2" fill="#9b8f79" text-anchor="start" letter-spacing="0.6">FOR A PERSON</text><text x="48.0" y="136.0" font-family="ZSans5,'DM Sans',system-ui,sans-serif" font-size="22" fill="#efe6df" text-anchor="start" letter-spacing="-0.44">Only you can send it.</text><text x="48.0" y="172.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#928b86" text-anchor="start">Every transfer waits for your</text><text x="48.0" y="196.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#928b86" text-anchor="start">face or fingerprint, for that exact</text><text x="48.0" y="220.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#928b86" text-anchor="start">amount and recipient.</text><rect x="344" y="56" width="276" height="3" fill="#ec9117"/><text x="344.0" y="96.0" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="11.2" fill="#9b8f79" text-anchor="start" letter-spacing="0.6">FOR A COMPANY</text><text x="344.0" y="136.0" font-family="ZSans5,'DM Sans',system-ui,sans-serif" font-size="22" fill="#efe6df" text-anchor="start" letter-spacing="-0.44">No one person can</text><text x="344.0" y="164.0" font-family="ZSans5,'DM Sans',system-ui,sans-serif" font-size="22" fill="#efe6df" text-anchor="start" letter-spacing="-0.44">empty the account.</text><text x="344.0" y="204.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#928b86" text-anchor="start">One prepares, another approves.</text><text x="344.0" y="228.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#928b86" text-anchor="start">The accountant gets the books.</text><rect x="640" y="56" width="276" height="3" fill="#ec9117"/><text x="640.0" y="96.0" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="11.2" fill="#9b8f79" text-anchor="start" letter-spacing="0.6">FOR AN AGENT</text><text x="640.0" y="136.0" font-family="ZSans5,'DM Sans',system-ui,sans-serif" font-size="22" fill="#efe6df" text-anchor="start" letter-spacing="-0.44">Only within your limits.</text><text x="640.0" y="172.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#928b86" text-anchor="start">Caps per call and per day, an</text><text x="640.0" y="196.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#928b86" text-anchor="start">allowlist of hosts, and payments</text><text x="640.0" y="220.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#928b86" text-anchor="start">bound to the exact URL.</text><rect x="936" y="56" width="276" height="3" fill="#ec9117"/><text x="936.0" y="96.0" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="11.2" fill="#9b8f79" text-anchor="start" letter-spacing="0.6">FOR EVERYONE</text><text x="936.0" y="136.0" font-family="ZSans5,'DM Sans',system-ui,sans-serif" font-size="22" fill="#efe6df" text-anchor="start" letter-spacing="-0.44">No rate. No asterisk.</text><text x="936.0" y="172.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#928b86" text-anchor="start">Euros backed one-for-one and</text><text x="936.0" y="196.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#928b86" text-anchor="start">kept in your name. Fees shown</text><text x="936.0" y="220.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#928b86" text-anchor="start">before you approve.</text><text x="640.0" y="296.0" font-family="ZMono,'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#918a85" text-anchor="middle">The stack is the receipt, not the headline: passkeys, Safe smart accounts, Monerium EURe and x402 sit one click down.</text><rect width="1280" height="330" filter="url(#grain)" opacity="0.06" style="mix-blend-mode:soft-light"/></g><rect x=".5" y=".5" width="1279" height="329" rx="20" fill="none" stroke="rgba(239,230,223,0.1)"/></svg>