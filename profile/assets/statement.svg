<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="t d"><title id="t">A bank account asks you to trust the bank. A Zold account answers only to your passkey.</title><desc id="d">Principle: funds never pass through Zold, Zold Pay or the agent payment hub.</desc><style>@font-face{font-family:ZMono;src:url(data:font/woff2;base64,) format('woff2')}
