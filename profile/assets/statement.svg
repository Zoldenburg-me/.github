<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="t d"><title id="t">Most money apps lead with a rate. We lead with who can say yes.</title><desc id="d">No rate. No asterisk. Zold cannot approve a transfer for you, and neither can Zold Pay or the hub.</desc><style>@font-face{font-family:ZMono;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:ZSans;src:url(data:font/woff2;base64,) format('woff2')}
</style><defs><clipPath id="frame"><rect width="1280" height="300" rx="20"/></clipPath><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs><g clip-path="url(#frame)"><rect width="1280" height="300" fill="#000"/><rect x="562.6" y="46.0" width="154.9" height="32" rx="16.0" fill="#080707" stroke="rgba(242,228,216,0.07)"/><text x="640.0" y="66.6" font-family="ZMono,'JetBrains Mono',ui-monospace,monospace" font-size="12.8" fill="#9b8f79" text-anchor="middle">Honesty position</text><text x="640.0" y="148.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="44" fill="#9b8f79" text-anchor="middle" letter-spacing="-1.2">Most money apps lead with a rate.</text><text x="640.0" y="204.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="44" fill="#efe6df" text-anchor="middle" letter-spacing="-1.2">We lead with who can say yes.</text><text x="640.0" y="256.0" font-family="ZMono,'JetBrains Mono',ui-monospace,monospace" font-size="12.8" fill="#918a85" text-anchor="middle">No rate. No asterisk. We don&#x27;t lend your euros out, so there is none to quietly cut.</text><rect width="1280" height="300" filter="url(#grain)" opacity="0.06" style="mix-blend-mode:soft-light"/></g><rect x=".5" y=".5" width="1279" height="299" rx="20" fill="none" stroke="rgba(239,230,223,0.1)"/></svg>